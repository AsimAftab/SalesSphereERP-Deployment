# SalesSphere ERP production stack. Only Caddy publishes host ports.

services:
  app:
    image: ${GHCR_IMAGE:-ghcr.io/asimaftab/salessphere-erp-backend}:${IMAGE_TAG:-latest}
    container_name: salessphere-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    image: ${FRONTEND_GHCR_IMAGE:-ghcr.io/asimaftab/salessphere-erp-frontend}:${FRONTEND_IMAGE_TAG:-latest}
    container_name: salessphere-frontend
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: salessphere-redis
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - redis-data:/data
    # maxmemory bounds what Redis can grow into; the AOF on redis-data is
    # otherwise unbounded on the same disk the image pulls need.
    # noeviction is deliberate — BullMQ job state must never be silently
    # evicted, so Redis refuses writes loudly instead of losing jobs.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: salessphere-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  internal:
    driver: bridge

volumes:
  redis-data:
  caddy-data:
  caddy-config:
